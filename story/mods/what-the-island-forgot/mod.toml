name = "what-the-island-forgot"
version = "0.1.0"
description = "What the island forgot: the island's lost memory, three roots under the north-east lands, new places, new recruits for File City"
authors = ["Digimon World: Horizon authors"]
requires = ["base >= 1.0"]
load_after = []
conflicts = []
# Story sources: Python handlers and placement-only script copies.
sources = ["early-game.py", "arcs/works/wild-screens.dws", "arcs/residents/beetle-cup.dws", "arcs/*/*.py", "district/*.py", "city/*.py"]

[save]
namespace = "wtif"
flags = "717-786"                           # the original engine's free flags (717-799); save.lock keeps the numbers
vars = "9-14"                               # saved counters (the memory the city keeps; 12-14 Tuskmon's deal of the day)
