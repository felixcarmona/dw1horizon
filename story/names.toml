# Names for what the game already uses (pstats = numbered variables, triggers = flags) and for NPCs.
# The beautifier (`dws decompile --readable`) writes these names instead of `p21` and `trigger(2)`; names are added
# entries here as they learn what a thing is. Only add what is known (docs/game/03-scripts.md has the table of pstats).
# The engine's own set (engine.arg, engine.cutscene, ...) is in story/core/engine.dws, not here.
#
# A name is a plain word or `group.word`. Nothing is allocated: these are `alias`es of numbers the game uses already.
# An entry is `N = "name"` or, when it is a proposal, `N = { name = "x", status = "proposed", confidence = "high|medium", evidence = "where it was learnt" }`: the same name for the tools.
# Low-confidence guesses are not here but in docs/data/story-analysis/names-proposals.csv.

