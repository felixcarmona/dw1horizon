name: Wiki guides
on:
  pull_request:
    paths: ['web/**', 'tools/wiki/**', 'tools/guide/**', '.github/workflows/wiki.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['web/**', 'tools/wiki/**', 'tools/guide/**', '.github/workflows/wiki.yml', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install print and extraction dependencies
        run: |
          python3 -m pip install -r tools/wiki/requirements.txt
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-audit --no-fund puppeteer-core@24.31.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Fetch the prepared release assets for the full browser suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/pages-input
          gh release download v0.0.7 --dir build/pages-input \
            --pattern horizon-package.tar.gz --pattern horizon-engine.tar.gz \
            --pattern horizon-checksums.json --pattern horizon-media.tar.gz --pattern horizon-maps.tar.gz
          git checkout --detach refs/tags/v0.0.7
          python3 tools/release_pages.py build v0.0.7 --inputs build/pages-input --out build/pages-site
          git checkout --detach "$GITHUB_SHA"
      - name: Build and check the release guides
        run: |
          export PUPPETEER_MODULE="file://$RUNNER_TEMP/pages-browser/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js"
          export CHROMIUM="$(command -v google-chrome)"
          python3 web/build.py --tag v0.0.7 --out build/pages-site
          mkdir -p build/pages-site/media/clips build/pages-site/media/maps
          test -z "$(tar -tzf build/pages-input/horizon-media.tar.gz | grep -vE '^[a-z0-9-]+\.(mp4|jpg)$')"
          tar -xzf build/pages-input/horizon-media.tar.gz -C build/pages-site/media/clips
          test -z "$(tar -tzf build/pages-input/horizon-maps.tar.gz | grep -vE '^map-[0-9]+\.(png|jpg)$')"
          tar -xzf build/pages-input/horizon-maps.tar.gz -C build/pages-site/media/maps
          python3 tools/wiki/check.py --site build/pages-site
          WIKI_PDF_SITE=build/pages-site python3 -m unittest discover -s tools/wiki -p 'test_*.py'
          python3 -m unittest discover -s tools/guide -p 'test_*.py'
          python3 tools/release_pages_test.py
          node web/test/i18n.mjs
          node web/test/wiki.mjs build/pages-site
