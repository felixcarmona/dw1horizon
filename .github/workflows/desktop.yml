name: Desktop patchers

# The Windows, macOS and Linux apps (tools/patcher/gui.py, frozen by tools/patcher/app/build.py), built from source here and
# tested headless (gui.py --self-test: the app as Python, spawned workers, dwpatch's derive launch, the window,
# the latest published package for PRs, the tag's verified package for releases). PRs and manual runs keep artifacts; a release
# tag (pushed, or given to a manual run) also attaches the zips to that tag's GitHub Release. No disc is used.

on:
  pull_request:
    paths:
      - 'tools/patcher/**'
      - 'tools/player/**'
      - 'tools/isowriter.py'
      - 'tools/test_desktop_patcher.py'
      - 'tools/derive/steps/plan.py'
      - 'tools/test_languages.py'
      - 'tools/test_model_variants.py'
      - 'tools/dws/**'
      - 'tools/test_dws_imports.py'
      - 'web/i18n/**'
      - 'web/data/discs.json'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag: build it and attach the apps to its release (empty: artifacts only)'
        required: false
        default: ''
        type: string

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
  PYINSTALLER: pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
  PYTHONUNBUFFERED: '1'

jobs:
  openbios:
    # The free BIOS Horizon Play boots with (tools/player/build.py): it needs a MIPS cross compiler, so it is built
    # here once and handed to the Windows and macOS jobs.
    runs-on: ubuntu-22.04   # 24.04 has no gcc-mipsel-linux-gnu package
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build OpenBIOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mipsel-linux-gnu g++-mipsel-linux-gnu > /dev/null
          mkdir openbios
          python3 tools/player/build.py --openbios-only openbios/openbios.bin --work "$RUNNER_TEMP/player"
      - uses: actions/upload-artifact@v4
        with:
          name: openbios
          path: openbios
          if-no-files-found: error

  android:
    # Horizon Play for Android (tools/player/android/build_apk.py), the template the patcher downloads from the release
    # and puts the built disc into (tools/patcher/apk.py signs that copy with the player's own key: no secret here).
    needs: openbios
    runs-on: ubuntu-22.04   # its Android SDK and NDK are preinstalled
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: openbios
          path: ${{ runner.temp }}/openbios
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          mkdir apk
          python3 tools/player/android/build_apk.py --out apk/Horizon-Play.apk --work "$RUNNER_TEMP/android" \
            --openbios "$RUNNER_TEMP/openbios/openbios.bin" ${RELEASE_TAG:+--version "$RELEASE_TAG"}
      - name: A disc put inside it still verifies (a dummy disc of zeros)
        run: |
          head -c $((2352 * 1000)) /dev/zero > "$RUNNER_TEMP/dummy.bin"
          python3 tools/patcher/apk.py apk/Horizon-Play.apk "$RUNNER_TEMP/dummy.bin" "$RUNNER_TEMP/dummy.apk" --key "$RUNNER_TEMP/key.json"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v "$RUNNER_TEMP/dummy.apk" | grep -q 'v2 scheme (APK Signature Scheme v2): true'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/dummy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-play-apk
          path: apk
          if-no-files-found: error

  windows:
    needs: openbios
    runs-on: windows-latest
    permissions:
      contents: write   # required to read draft release assets; token only used by the fetch step
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check out the release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Unit tests
        working-directory: tools
        # (not test_patcher_paths here: its folder names end in a space, which Windows does not allow)
        run: python -m unittest test_desktop_patcher -v
      - name: Story import identity
        run: python -m unittest tools.test_dws_imports -v
      - name: Chinese resource paths (including the v0.0.7 bundle)
        run: >-
          python -m unittest -v
          tools.test_languages.Languages.test_chinese_resource_routes_use_portable_paths
          tools.test_model_variants.PinKeys.test_v007_windows_chinese_manifest_passes_hole_checks
      - uses: actions/download-artifact@v4
        with:
          name: openbios
          path: ${{ runner.temp }}/openbios
      - name: Build Horizon Play (the program, the SwanStation core, OpenBIOS)
        shell: bash
        run: python tools/player/build.py --out "$RUNNER_TEMP/Horizon Play" --work "$RUNNER_TEMP/player" --openbios "$RUNNER_TEMP/openbios/openbios.bin"
      - name: Build the setup template (the wizard and Horizon Play, no game; the patcher appends the player's disc)
        shell: bash
        run: |
          # makensis is normally preinstalled on the runner; install it when it is not
          if ! command -v makensis > /dev/null && [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          mkdir setup
          python tools/player/installer.py --player "$RUNNER_TEMP/Horizon Play" --out setup/Horizon-Setup.exe ${RELEASE_TAG:+--version "$RELEASE_TAG"}
      - name: A setup made from a dummy disc installs, unpacks the disc byte for byte and uninstalls
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          python -c "import sys; open(sys.argv[1] + '/dummy.bin', 'wb').write(bytes(range(251)) * 20000)" $t
          Set-Content "$t\dummy.cue" 'FILE "dummy.bin" BINARY', '  TRACK 01 MODE2/2352', '    INDEX 01 00:00:00'
          python tools/patcher/setup_exe.py setup/Horizon-Setup.exe "$t\dummy.cue" "$t\Dummy-Setup.exe"
          # the bare template must refuse to install (silent: it just quits with an error code)
          $bare = Start-Process setup/Horizon-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($bare.ExitCode -eq 0) { throw 'the template without a disc installed' }
          $inst = "$t\hsetup"
          # /D= must be the last argument and is not quoted
          $p = Start-Process "$t\Dummy-Setup.exe" -ArgumentList '/S', "/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          if ((Get-FileHash "$inst\Digimon World Horizon.bin").Hash -ne (Get-FileHash "$t\dummy.bin").Hash) { throw 'the unpacked disc differs' }
          $cue = Get-Content "$inst\Digimon World Horizon.cue" -Raw
          if ($cue -notmatch 'FILE "Digimon World Horizon.bin" BINARY') { throw "wrong cue: $cue" }
          if (-not (Test-Path "$inst\horizon-play.exe")) { throw 'Horizon Play is not installed' }
          # the uninstaller copies itself away and returns at once: wait for the folder to go
          Start-Process "$inst\Uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $inst); $i++) { Start-Sleep 1 }
          if (Test-Path $inst) { throw 'the uninstaller left the folder' }
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-setup-template
          path: setup/Horizon-Setup.exe
          if-no-files-found: error
      - name: Build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check $PYINSTALLER
          python tools/patcher/app/build.py ${RELEASE_TAG:+--version "$RELEASE_TAG"} --player "$RUNNER_TEMP/Horizon Play"
          test -f "build/desktop/dist/Horizon Patcher/_internal/player/horizon-play.exe"
          test -f "build/desktop/dist/Horizon Patcher/_internal/player/swanstation_libretro.dll"
          test -f "build/desktop/dist/Horizon Patcher/_internal/player/system/openbios.bin"
      - name: Prepare the tag's verified self-test package
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/patcher/app/prepare_selftest.py "$RELEASE_TAG"
      - name: Self-test the frozen app (no console, no discs)
        shell: bash
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          exe = r'build\desktop\dist\Horizon Patcher\Horizon Patcher.exe'
          # The windowed program as a child with pipes, as dwpatch starts it.
          r = subprocess.run([exe, '-c', 'import sys; print("child", sys.argv[1:], sys.flags.utf8_mode)', 'a b'],
                             capture_output=True, timeout=120)
          print('child:', r.returncode, r.stdout, r.stderr)
          package_args = (['--package', os.path.abspath('build/desktop-selftest/package')]
                          if os.environ.get('RELEASE_TAG') else ['--download'])
          code = 1
          try:
              code = subprocess.run([exe, '--self-test', *package_args, '--gui', '--report', 'selftest.txt'],
                                    timeout=1200).returncode
          except subprocess.TimeoutExpired:
              print('the self-test did not finish in 20 minutes')
          finally:
              if os.path.exists('selftest.txt'):
                  print(open('selftest.txt', encoding='utf-8').read())
          sys.exit(code or (r.returncode != 0))
          EOF
      - name: Version information
        shell: pwsh
        run: |
          $info = (Get-Item 'build\desktop\dist\Horizon Patcher\Horizon Patcher.exe').VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, CompanyName, FileDescription
          if ($info.ProductName -ne 'Digimon World: Horizon Patcher') { exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path 'build\desktop\dist\Horizon Patcher' -DestinationPath Horizon-Patcher-Windows.zip
      # The unsigned build, as an artifact a signing service can take (see docs/release/releasing.md, "Code
      # signing"). Once the project is accepted by SignPath, a step goes here:
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ...
      #     project-slug: ...
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed
      # and the release upload takes the signed zip instead.
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: Horizon-Patcher-Windows
          path: Horizon-Patcher-Windows.zip
          if-no-files-found: error

  macos:
    needs: openbios
    runs-on: macos-15
    permissions:
      contents: write   # required to read draft release assets; token only used by the fetch step
    outputs:
      notarized: ${{ steps.zip.outputs.notarized }}
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.ASC_KEY_P8 != '' }}
      # python.org's universal2 installer: one app for Apple silicon and Intel Macs, with its own Tcl/Tk.
      PY_VERSION: 3.13.17
      PY_SHA256: 3053592af66128269efab37fe7851a4894920b27c442aeec99ce4d34d17c07e3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check out the release tag
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Install python.org Python (universal2)
        run: |
          curl -sSfLo python.pkg "https://www.python.org/ftp/python/$PY_VERSION/python-$PY_VERSION-macos11.pkg"
          echo "$PY_SHA256  python.pkg" | shasum -a 256 -c -
          sudo installer -pkg python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/${PY_VERSION%.*}/bin/python3
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        working-directory: tools
        run: python -m unittest test_desktop_patcher test_patcher_paths -v
      - name: Signing keychain (only with the owner's secrets; skipped otherwise)
        if: env.HAS_CERT == 'true' && github.event_name != 'pull_request'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo 'No Developer ID Application identity in MACOS_CERT_P12'; exit 1; }
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: openbios
          path: ${{ runner.temp }}/openbios
      - name: Build Horizon Play (universal2; signed like the app when the owner's identity is there)
        run: |
          P="$RUNNER_TEMP/Horizon Play"
          python tools/player/build.py --universal2 --out "$P" --work "$RUNNER_TEMP/player" --openbios "$RUNNER_TEMP/openbios/openbios.bin"
          R="$P/Horizon Play.app/Contents/Resources"
          for f in "$P/Horizon Play.app/Contents/MacOS/horizon-play" "$R/swanstation_libretro.dylib"; do
            lipo -archs "$f" | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          done
          if [ -n "$SIGN_ID" ]; then
            # the core recompiles PlayStation code at run time: the hardened runtime must allow JIT memory
            codesign --force --timestamp --options runtime --sign "$SIGN_ID" "$R/swanstation_libretro.dylib"
            codesign --force --timestamp --options runtime --entitlements tools/player/entitlements.plist \
              --sign "$SIGN_ID" "$P/Horizon Play.app"
          fi
          # the template the patcher downloads on other systems to make a Mac app (symlinks, modes and signature kept)
          mkdir mac
          ditto -c -k --keepParent "$P/Horizon Play.app" mac/Horizon-Play-macOS.zip
          python3 - "$P" <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'tools/patcher')
          import desktop
          app = desktop.unzip_app('mac/Horizon-Play-macOS.zip', os.path.join(os.environ['RUNNER_TEMP'], 'unzipped'))
          subprocess.run(['codesign', '--verify', '--deep', '--strict', app], check=True)   # survives the round trip
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-play-macos
          path: mac/Horizon-Play-macOS.zip
          if-no-files-found: error
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check $PYINSTALLER certifi==2026.10.23
          if [ -z "$SIGN_ID" ]; then
            echo '::warning::No signing secrets (MACOS_CERT_P12, ASC_KEY_P8...) or a pull request: the macOS app is NOT signed or notarized; Gatekeeper will warn players.'
          fi
          python tools/patcher/app/build.py --universal2 ${RELEASE_TAG:+--version "$RELEASE_TAG"} \
            ${SIGN_ID:+--codesign-identity "$SIGN_ID" --entitlements tools/patcher/app/entitlements.plist} \
            --player "$RUNNER_TEMP/Horizon Play"
          lipo -archs "build/desktop/dist/Horizon Patcher.app/Contents/MacOS/Horizon Patcher"
          test -x "build/desktop/dist/Horizon Patcher.app/Contents/Helpers/Horizon Play.app/Contents/MacOS/horizon-play"
          codesign --verify --deep --strict "build/desktop/dist/Horizon Patcher.app"
      - name: A Mac app made from a dummy disc mounts, holds the disc byte for byte and verifies
        run: |
          T="$RUNNER_TEMP"
          python3 -c "import sys; open(sys.argv[1] + '/dummy.bin', 'wb').write(bytes(range(251)) * 20000)" "$T"
          printf 'FILE "dummy.bin" BINARY\r\n  TRACK 01 MODE2/2352\r\n    INDEX 01 00:00:00\r\n' > "$T/dummy.cue"
          python3 tools/patcher/mac_app.py "$T/Horizon Play/Horizon Play.app" "$T/dummy.cue" "$T/dummy-Mac.dmg"
          hdiutil attach "$T/dummy-Mac.dmg" -mountpoint "$T/mnt" -nobrowse -readonly
          A="$T/mnt/Digimon World Horizon.app"
          test -L "$T/mnt/Applications"
          cmp "$A/Contents/Resources/Digimon World Horizon.bin" "$T/dummy.bin"
          grep -q 'FILE "Digimon World Horizon.bin" BINARY' "$A/Contents/Resources/Digimon World Horizon.cue"
          grep -q 'Digimon World Horizon' "$A/Contents/Info.plist"
          codesign --verify --deep --strict "$A"
          # the app finds the disc beside itself; a window may not open on a runner without a display, so this
          # launch only reports (the log line is the proof when it does start)
          mkdir -p "$T/saves"
          (timeout 60 "$A/Contents/MacOS/horizon-play" --frames 60 --windowed --saves "$T/saves" || true)
          grep -h "disc beside the program" "$T/saves/horizon-play.log" || echo '::warning::the launch check did not reach the disc line'
          hdiutil detach "$T/mnt"
      - name: Prepare the tag's verified self-test package
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/patcher/app/prepare_selftest.py "$RELEASE_TAG"
      - name: Self-test the frozen app (Apple silicon)
        run: |
          args=(--download)
          if [ -n "$RELEASE_TAG" ]; then args=(--package "$PWD/build/desktop-selftest/package"); fi
          "build/desktop/dist/Horizon Patcher.app/Contents/MacOS/Horizon Patcher" --self-test "${args[@]}" --gui --report selftest.txt
      - name: Self-test the frozen app (Intel, under Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            args=(--download)
            if [ -n "$RELEASE_TAG" ]; then args=(--package "$PWD/build/desktop-selftest/package"); fi
            arch -x86_64 "build/desktop/dist/Horizon Patcher.app/Contents/MacOS/Horizon Patcher" --self-test "${args[@]}" --report selftest-x86_64.txt
          else
            echo '::warning::Rosetta is not installed on this runner: the Intel half was built but not run.'
          fi
      - name: Verify the signature, notarize and staple
        if: env.SIGN_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          APP="build/desktop/dist/Horizon Patcher.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E 'flags=.*runtime' || { echo 'hardened runtime missing'; exit 1; }
          codesign -dvvv "$APP" 2>&1 | grep -q '^Timestamp=' || { echo 'secure timestamp missing'; exit 1; }
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 1h --output-format json \
            | tee "$RUNNER_TEMP/notary.json"
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          rm "$RUNNER_TEMP/AuthKey.p8"
      - name: Zip
        id: zip
        run: |
          ditto -c -k --keepParent "build/desktop/dist/Horizon Patcher.app" Horizon-Patcher-macOS.zip
          # (the step above stops the job unless the app was signed, notarized and stapled)
          echo "notarized=$([ -n "$SIGN_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Remove the signing keychain
        if: always() && env.SIGN_ID != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-Patcher-macOS
          path: Horizon-Patcher-macOS.zip
          if-no-files-found: error

  linux:
    # 22.04: the oldest glibc a GitHub runner still has, so the app runs on older distributions too. Horizon Play is built
    # here, as player.yml builds it (its own OpenBIOS: this runner has the MIPS compiler), rather than taken from that
    # workflow: the two cannot wait for each other, and the build takes minutes.
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # required to read draft release assets; token only used by the fetch step
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check out the release tag
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libtk8.6 xvfb libgl1-mesa-dri > /dev/null
      - name: Unit tests
        working-directory: tools
        run: xvfb-run -a python -m unittest test_desktop_patcher test_patcher_paths -v
      - name: Story import identity
        run: python -m unittest tools.test_dws_imports -v
      - name: Build Horizon Play (the program, the SwanStation core, OpenBIOS)
        run: python tools/player/build.py --out "$RUNNER_TEMP/Horizon Play" --work "$RUNNER_TEMP/player"
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check $PYINSTALLER
          python tools/patcher/app/build.py ${RELEASE_TAG:+--version "$RELEASE_TAG"} --player "$RUNNER_TEMP/Horizon Play"
          D="build/desktop/dist/Horizon Patcher"
          test -f "$D/_internal/player/horizon-play"
          test -f "$D/_internal/player/system/openbios.bin"
          # Tk comes along: a system without python3-tk runs the app
          ls "$D/_internal" | grep -q '^libtk8' && test -d "$D/_internal/_tk_data" && test -d "$D/_internal/_tcl_data"
          test -f "$D/Horizon Patcher.desktop" && test -f "$D/horizon-patcher.png"
      - name: Prepare the tag's verified self-test package
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/patcher/app/prepare_selftest.py "$RELEASE_TAG"
      - name: Self-test the frozen app (a virtual display, no discs)
        run: |
          EXE="build/desktop/dist/Horizon Patcher/Horizon Patcher"
          "$EXE" -c 'import sys; print("child", sys.argv[1:], sys.flags.utf8_mode)' 'a b'
          if [ -n "$RELEASE_TAG" ]; then PKG=(--package "$PWD/build/desktop-selftest/package"); else PKG=(--download); fi
          timeout 1200 xvfb-run -a -s '-screen 0 1280x1000x24' "$EXE" --self-test "${PKG[@]}" --gui --report selftest.txt \
            || { cat selftest.txt || true; exit 1; }
          cat selftest.txt
      - name: Tar
        run: tar -czf Horizon-Patcher-Linux-x86_64.tar.gz -C build/desktop/dist "Horizon Patcher"
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-Patcher-Linux
          path: Horizon-Patcher-Linux-x86_64.tar.gz
          if-no-files-found: error

  linux-source:
    # Not shipped: the window and the self-test from source, as a developer runs them (python3 tools/patcher/gui.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Unit tests and the self-test from source
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          (cd tools && python -m unittest test_desktop_patcher test_patcher_paths -v)
          xvfb-run -a python tools/patcher/gui.py --self-test --download --gui
          # A short screen (a small laptop): the window scrolls instead of cutting anything.
          xvfb-run -a -s '-screen 0 1024x600x24' python tools/patcher/gui.py --self-test --gui

  attach:
    # Only for a release tag; pull requests and manual runs without a tag stop at the artifacts above.
    needs: [windows, macos, android, linux]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to start release.yml again, so the site offers the apps
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOTARIZED: ${{ needs.macos.outputs.notarized }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Attach the apps to the release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          # The release is drafted before its tag is pushed (docs/release/releasing.md); wait a little if not yet.
          for i in $(seq 1 30); do
            gh release view "$RELEASE_TAG" > /dev/null 2>&1 && break
            sleep 20
          done
          # The empty installer templates (no game in them): the patcher downloads them from the release when it makes
          # an installer. Horizon-Play-Linux-x86_64.tar.gz, the fourth, is attached by player.yml.
          gh release upload "$RELEASE_TAG" apps/Horizon-Patcher-Windows.zip apps/Horizon-Patcher-macOS.zip \
            apps/Horizon-Patcher-Linux-x86_64.tar.gz \
            apps/Horizon-Setup.exe apps/Horizon-Play.apk apps/Horizon-Play-macOS.zip --clobber
      - name: Describe the apps for the site
        # horizon-desktop.json goes up after the zips it describes: release.yml offers the apps on dw1horizon.com only
        # when it finds this file, and checks both zips against it (tools/release_pages.py desktop_apps).
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          def app(name, **extra):
              data = open(f'apps/{name}', 'rb').read()
              return dict(name=name, size=len(data), sha256=hashlib.sha256(data).hexdigest(), **extra)
          json.dump({'tag': os.environ['RELEASE_TAG'], 'run': os.environ['RUN_URL'],
                     'windows': app('Horizon-Patcher-Windows.zip', signed=False),   # SignPath: not yet
                     'macos': app('Horizon-Patcher-macOS.zip', notarized=os.environ['NOTARIZED'] == 'true')},
                    open('horizon-desktop.json', 'w'), indent=2)
          PY
          cat horizon-desktop.json
          gh release upload "$RELEASE_TAG" horizon-desktop.json --clobber
      - name: Deploy the site again, now with the apps
        # Only for the release the site serves or is about to serve (the latest, or a draft whose release.yml run is
        # still going): a manual run for an older tag must not put an older engine on the site. The rerun waits for a
        # running release.yml (its concurrency group) and takes the page from main, as a page-only redeploy does.
        run: |
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$latest" = "$RELEASE_TAG" ] || [ "$draft" = true ]; then
            gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$RELEASE_TAG"
          else
            echo "::notice::$RELEASE_TAG is not the latest release ($latest): the site is left as it is."
          fi
