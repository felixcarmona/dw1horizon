<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">Digimon World: Horizon</title>
  <meta name="description" data-i18n-attr="content:meta.description" content="">
  <meta name="theme-color" content="#cfd8f6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <a class="brand" href="#top">Digimon World: Horizon</a>
      <nav class="pill" aria-label="Main">
        <!-- The page's language: each by its own name (options made by js/app.js from js/i18n.js NAMES). -->
        <label class="lang">
          <span id="lang-flag" class="lang-flag" aria-hidden="true"></span>
          <select id="lang" data-i18n-attr="aria-label:lang.label"></select>
        </label>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <h1 data-i18n="hero.title"></h1>
        <div class="hero-actions">
          <a class="button primary" href="#patch" data-i18n="hero.cta"></a>
          <a class="button soft" href="#features" data-i18n="hero.cta2"></a>
          <a class="button discord" id="link-discord" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg><span data-i18n="community.discord"></span></a>
          <a class="button github" id="link-github" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-i18n="community.github"></span></a>
        </div>
      </section>

      <section id="patch" class="patcher" data-batches="0">
        <h2 data-i18n="patcher.title"></h2>
        <p class="sub" data-i18n="patcher.lead"></p>
        <!-- Photo: Evan-Amos, public domain (Wikimedia Commons). -->
        <!-- The four discs, one slot each (made from data/discs.json by js/app.js): the cover in grey until its disc
             is added, the game and what it is for, the check's progress over the cover, then the check and ×. The
             release and checksums under Details. -->
        <ul id="slots" class="slots" data-i18n-attr="aria-label:slot.listLabel"></ul>
        <ul id="jobs" class="jobs" aria-live="polite"></ul>
        <!-- The drop zone: one button (click, Enter, or drop files on it or anywhere on the page). The icon is our
             own drawing: an arrow down into an open tray; on drag-over the arrow dips into it. -->
        <button id="add-button" class="drop-zone" type="button">
          <svg class="drop-border" width="100%" height="100%" aria-hidden="true"><rect x="1.5" y="1.5" rx="20.5" /></svg>
          <svg class="drop-icon" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <g class="drop-arrow"><path d="M16 4v14"/><path d="M10.5 12.5 16 18l5.5-5.5"/></g>
            <path d="M5 21.5v4a2.5 2.5 0 0 0 2.5 2.5h17a2.5 2.5 0 0 0 2.5-2.5v-4"/>
          </svg>
          <span class="drop-text" data-i18n="add.button"></span>
          <span class="drop-hint" data-i18n="add.hint"></span>
        </button>
        <input id="add-input" class="file" type="file" multiple tabindex="-1" aria-hidden="true">
        <details class="sums" hidden>
          <summary data-i18n="slot.details"></summary>
          <div class="sums-scroll">
            <table>
              <thead><tr><th></th><th>CRC-32</th><th>SHA-1</th><th data-i18n="slot.size"></th></tr></thead>
              <tbody id="sums-body"></tbody>
            </table>
          </div>
        </details>
        <div class="patch-row">
          <button id="patch-button" class="button primary has-version" type="button" disabled>
            <span data-i18n="patch.button"></span>
            <!-- The release the engine builds (js/app.js: engine/current.json). -->
            <small id="release" class="release" hidden></small>
          </button>
          <div id="patch-status" class="patch-status" role="status" aria-live="polite"></div>
        </div>
        <!-- What the page promises about the player's discs; the link goes to the code that does the work. -->
        <aside class="privacy">
          <svg class="privacy-seal" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          <b data-i18n="privacy.title"></b>
          <ul class="privacy-chips">
            <li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L19.5 7"/></svg><span data-i18n="privacy.chip1"></span></li>
            <li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L19.5 7"/></svg><span data-i18n="privacy.chip2"></span></li>
            <li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L19.5 7"/></svg><span data-i18n="privacy.chip3"></span></li>
          </ul>
          <p data-i18n="privacy.body"></p>
          <p><span data-i18n="privacy.audit"></span> <a id="audit-link" href="#" target="_blank" rel="noopener" data-i18n="privacy.code"></a></p>
        </aside>
        <!-- The build, in this browser: progress, then the disc to download. -->
        <div id="build" class="build" hidden>
          <div class="build-head">
            <b id="build-phase" role="status" aria-live="polite"></b>
            <span id="build-time" class="build-time"></span>
          </div>
          <div id="build-progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <div id="build-detail" class="build-detail" hidden>
            <ol id="build-steps" class="build-steps"></ol>
            <ul id="build-workers" class="build-workers"></ul>
          </div>
          <div id="build-error" class="build-error" role="alert" hidden></div>
          <div id="build-done" class="build-done" hidden>
            <div class="build-links">
              <a id="dl-all" class="button primary" href="#"></a>
            </div>
            <p class="build-note" data-i18n="build.howTo"></p>
            <p class="build-parts"><span data-i18n="build.downloadParts"></span>
              <a id="dl-bin" href="#" data-i18n="build.partBin"></a> · <a id="dl-cue" href="#" data-i18n="build.partCue"></a></p>
            <p id="build-sha" class="build-sha"></p>
          </div>
          <div class="build-foot">
            <button id="build-stop" class="link-button" type="button" data-i18n="build.stop"></button>
            <details class="build-log"><summary data-i18n="build.details"></summary><pre id="build-log"></pre></details>
          </div>
        </div>
      </section>

      <section id="features" class="features">
        <h2 data-i18n="features.title"></h2>
        <p class="sub" data-i18n="features.lead"></p>
        <div id="feature-list" class="feature-list"></div>
      </section>
    </main>

    <footer class="foot">
      <p data-i18n="footer.legal"></p>
    </footer>
  </div>

  <div id="drop-veil" class="drop-veil" aria-hidden="true"><p data-i18n="patcher.dropHint"></p></div>

  <!-- The files that cannot be used, from one drop or choice. -->
  <dialog id="problems" class="problems" aria-labelledby="problems-title">
    <h3 id="problems-title"></h3>
    <ul id="problems-list" class="problems-list"></ul>
    <div class="problems-foot"><button id="problems-close" class="button primary" type="button" data-i18n="problems.close" autofocus></button></div>
  </dialog>
</body>
</html>
